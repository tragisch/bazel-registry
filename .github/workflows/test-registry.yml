name: Build Registry Modules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-modules:
    name: Determine modules to test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install presubmit YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/registry-presubmit"
          "$RUNNER_TEMP/registry-presubmit/bin/python" -m pip install PyYAML==6.0.3

      - name: Test presubmit selection
        run: |
          "$RUNNER_TEMP/registry-presubmit/bin/python" -m unittest discover -s tools/tests -p test_select_presubmits.py

      - id: select
        name: Select changed module versions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_modules=$(cat <<'JSON'
          [
            {"name":"argon2","version":"20190702","target":"@argon2//:argon2","command":"build"},
            {"name":"argtable3","version":"3.2.2","target":"@argtable3//:argtable3","command":"build"},
            {"name":"box2d","version":"3.0.0","target":"@box2d//:box2d","command":"build"},
            {"name":"cjson","version":"1.7.19","target":"@cjson//:cjson","command":"build"},
            {"name":"csv_fast","version":"0.1.0","target":"@csv_fast//:csv_fast","command":"build"},
            {"name":"cglm","version":"0.9.6","target":"@cglm//:cglmc","command":"build"},
            {"name":"graphviz","version":"15.0.0","target":"@graphviz//:graphviz","command":"build"},
            {"name":"graphviz","version":"15.0.0.vex.1","label":"graphviz@15.0.0.vex.1","target":"@graphviz//:graphviz_swift_mvp @graphviz//plugin:gv_swift_mvp_smoke_test","command":"test"},
            {"name":"graphblas","version":"10.3.1","target":"@graphblas//:graphblas","command":"build"},
            {"name":"gnuplot_i","version":"1.0","target":"@gnuplot_i//:gnuplot_i","command":"build"},
            {"name":"gunslinger","version":"0.03-alpha","target":"@gunslinger//:gunslinger","command":"build"},
            {"name":"libb64","version":"2.0.0.1","target":"@libb64//:libb64","command":"build"},
            {"name":"libcsv","version":"b1d5212831842ee5869d99bc208a21837e4037d5","target":"@libcsv//:libcsv","command":"build"},
            {"name":"liblinear","version":"247","target":"@liblinear//:liblinear","command":"build"},
            {"name":"libsodium","version":"1.0.20","target":"@libsodium//:libsodium","command":"build"},
            {"name":"linmath","version":"3eef82841046507e16a0f6194a61cee2eadd34b3","target":"@linmath//:linmath","command":"build"},
            {"name":"lmdb","version":"0.9.31","target":"@lmdb//:lmdb","command":"build"},
            {"name":"matio","version":"1.5.27","target":"@matio//:matio","command":"build"},
            {"name":"libzmq","version":"4.3.5","target":"@libzmq//:libzmq","command":"build"},
            {"name":"mpc","version":"0.9.0","target":"@mpc//:mpc","command":"build"},
            {"name":"czmq","version":"4.2.1","target":"@czmq//:czmq","command":"build"},
            {"name":"pcg","version":"83252d9c23df9c82ecb42210afed61a7b42402d7","target":"@pcg//:pcg","command":"build"},
            {"name":"pbplots","version":"0.1.9.1","target":"@pbplots//:pbPlots","command":"build"},
            {"name":"openblas","version":"0.3.33","target":"@openblas//:openblas","command":"build","os":["ubuntu-latest"]},
            {"name":"openblas_lapack","version":"0.3.33","target":"@openblas_lapack//:openblas_lapack","command":"build","os":["ubuntu-latest"]},
            {"name":"openmp","version":"22.1.1","target":"@openmp//:omp_smoke_test","command":"test"},
            {"name":"raylib","version":"5.5","target":"@raylib//:raylib","command":"build"},
            {"name":"sds","version":"2.0.0","target":"@sds//:sds","command":"build"},
            {"name":"sha1","version":"e1e2536fcf6a8f9703be8c85d58724b408552287","target":"@sha1//:sha1","command":"build"},
            {"name":"throw_the_switch","version":"2.6.1-bazel.1","target":"@throw_the_switch//:Unity","command":"build"},
            {"name":"utest","version":"f2fe2880253cdb090c906958e4937d24717aa39b","target":"@utest//:utest_main","command":"build"},
            {"name":"uthash","version":"2.3.0","target":"@uthash//:uthash","command":"build"},
            {"name":"yyjson","version":"0.10.0","target":"@yyjson//:yyjson","command":"build"}
          ]
          JSON
          )

          "$RUNNER_TEMP/registry-presubmit/bin/python" tools/select_presubmits.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" <<< "$all_modules"

  build-module:
    needs: determine-modules
    if: needs.determine-modules.outputs.count != '0'
    name: ${{ matrix.module.label || matrix.module.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-modules.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          version="v1.27.0"
          os_name=$(uname -s)
          arch_name=$(uname -m)

          case "$os_name" in
            Linux) platform="linux" ;;
            Darwin) platform="darwin" ;;
            *) echo "Unsupported OS: $os_name" >&2; exit 1 ;;
          esac

          case "$arch_name" in
            x86_64|amd64) asset_arch="amd64" ;;
            arm64|aarch64) asset_arch="arm64" ;;
            *) echo "Unsupported architecture: $arch_name" >&2; exit 1 ;;
          esac

          asset="bazelisk-${platform}-${asset_arch}"
          url="https://github.com/bazelbuild/bazelisk/releases/download/${version}/${asset}"

          curl -L --fail "$url" -o bazelisk
          chmod +x bazelisk
          sudo mv bazelisk /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          bazelisk version

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl-dev \
            libblas-dev liblapack-dev

      - name: Create test workspace
        env:
          MODULE_NAME: ${{ matrix.module.name }}
          MODULE_VERSION: ${{ matrix.module.version }}
          RUNNER_PLATFORM: ${{ runner.os }}
          PRESUBMIT: ${{ matrix.module.presubmit || false }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path("/tmp/build-test")
          workspace.mkdir()
          name = json.dumps(os.environ["MODULE_NAME"])
          version = json.dumps(os.environ["MODULE_VERSION"])
          registry = json.dumps(Path(os.environ["GITHUB_WORKSPACE"]).as_uri())
          lines = ['module(name = "build_test")']
          presubmit = os.environ["PRESUBMIT"] == "true"
          if presubmit and os.environ["RUNNER_PLATFORM"] == "macOS":
              lines.append('bazel_dep(name = "apple_support", version = "2.11.0")')
          lines.extend([
              'bazel_dep(name = "rules_cc", version = "0.2.17")',
              'bazel_dep(name = "bazel_skylib", version = "1.8.2")',
              'bazel_dep(name = "platforms", version = "1.0.0")',
              f'bazel_dep(name = {name}, version = {version})',
          ])
          if presubmit:
              lines.append(f'single_version_override(module_name = {name}, version = {version}, registry = {registry})')
          (workspace / "MODULE.bazel").write_text("\n".join(lines) + "\n")
          (workspace / "BUILD.bazel").touch()
          PY

      - name: Verify consumer of ${{ matrix.module.name }}@${{ matrix.module.version }}
        working-directory: /tmp/build-test
        env:
          COMMANDS: ${{ toJSON(matrix.module.commands) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          registry = Path(os.environ["GITHUB_WORKSPACE"]).as_uri()
          for job in json.loads(os.environ["COMMANDS"]):
              subprocess.run(
                  ["bazelisk", job["command"], f"--registry={registry}",
                   "--registry=https://bcr.bazel.build", "--", *job["targets"]],
                  check=True,
              )
          PY
        timeout-minutes: 20

  no-module-changes:
    needs: determine-modules
    if: needs.determine-modules.outputs.count == '0'
    name: No registry module changes
    runs-on: ubuntu-latest

    steps:
      - name: Report skipped module builds
        run: echo "No registry module changes detected; skipping module build matrix."
